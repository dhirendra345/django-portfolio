{% extends 'base.html' %}

{% block content %}

<h2>{{ project.title }}</h2>

{% if project.image %}
    <img src="{{ project.image.url }}" width="400">
{% endif %}

<p>{{ project.description }}</p>

{% if project.github_link %}
    <p>
        <a href="{{ project.github_link }}" target="_blank">
            View on GitHub
        </a>
    </p>
{% endif %}

{% if project.live_link %}
    <p>
        <a href="{{ project.live_link }}" target="_blank">
            Live Demo
        </a>
    </p>
{% endif %}

{% endblock %}
